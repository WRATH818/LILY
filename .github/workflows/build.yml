name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Lily-linux
          - os: windows-latest
            artifact: Lily-windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 mutagen python-vlc pyinstaller

      - name: Compilar
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Lily venice_player.py

      - name: Empacotar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          cp dist/Lily release/Lily-linux
          chmod +x release/Lily-linux

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir release
          copy dist\Lily.exe release\Lily-windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
